</style></head><body><header><h1>居中悬浮版 · 资源预览</h1><p>全屏巴黎风景 · 大厅与矩形棋盘关卡</p></header><nav class="toolbar"><button data-mode="lobby" class="active">大厅</button><button data-mode="level">关卡</button><button id="reset">还原</button></nav><main class="preview-wrap"><div id="screen"><div id="canvas"></div></div></main><footer>点击 PLAY 进入关卡。选字可组成 RAT 或 TEA；右上方可打乱字母、使用提示。<br>界面由独立图片、字体与布局数据实时组装。</footer><div id="toast" role="status"></div><script>window.PACK_LAYOUT={"schema":"word-journey-centered-layout-v1","canvas":{"width":1080,"height":1920,"origin":"top-left","coordinateUnits":"design-pixels","anchorsDefault":[0.5,0.5],"aspect":"9:16","scaleMode":"uniform-fit","safeInsets":{"top":48,"right":40,"bottom":48,"left":40}},"screens":{"lobby":{"background":"assets/backgrounds/bg-paris-lobby.png","calendar":{"disc":{"x":43.61,"y":70.09,"width":99.85,"height":99.96},"icon":{"x":63.12,"y":88.47,"width":61.98,"height":62.05}},"settings":{"icon":{"x":954.9,"y":78.13,"width":78.04,"height":78.13}},"coin":{"pill":{"x":732.24,"y":71.24,"width":199.7,"height":86.18},"icon":{"x":751.75,"y":89.62,"width":52.79,"height":52.85},"text":{"id":"coins","value":"240","center":{"x":874.56,"y":116.05},"fontSize":40.17,"fontWeight":700,"letterSpacing":0,"color":"#353832","align":"center","anchor":[0.5,0.5]}},"labels":[{"id":"gameTitle","value":"WORD JOURNEY","center":{"x":540,"y":259.68},"fontSize":41.32,"fontWeight":900,"letterSpacing":5.74,"color":"#353832","align":"center","anchor":[0.5,0.5]},{"id":"destination","value":"Paris","center":{"x":540,"y":427.43},"fontSize":168.71,"fontWeight":900,"letterSpacing":0,"color":"#353832","align":"center","anchor":[0.5,0.5]},{"id":"chapter","value":"FRANCE · CHAPTER 01","center":{"x":540,"y":549.23},"fontSize":28.69,"fontWeight":700,"letterSpacing":4.25,"color":"#353832","align":"center","anchor":[0.5,0.5]},{"id":"journeyProgress","value":"8 / 20","center":{"x":540,"y":1499.46},"fontSize":37.87,"fontWeight":700,"letterSpacing":0,"color":"#353832","align":"cent     const {screens}=window.PACK_LAYOUT;
    const stage=document.querySelector("#canvas");
    let current="lobby",solved=new Set(["roam","arm","oar"]),hintCount=3,selected=[];
    let board=screens.level.board.cells.map(c=>({...c,rect:{...c.rect}}));
    const paths={primary:"assets/ui/button-primary.png",letter:"assets/ui/tile-letter.png",answer:"assets/ui/tile-answer-filled.png",empty:"assets/ui/tile-answer-empty.png",disc:"assets/ui/utility-disc.png",pill:"assets/ui/coin-pill.png",badge:"assets/ui/counter-badge.png",selection:"assets/ui/tile-selection.png"};
    function sprite(src,r,parent=stage){const el=document.createElement("img");el.className="sprite";el.src=src;el.alt="";Object.assign(el.style,{left:r.x+"px",top:r.y+"px",width:r.width+"px",height:r.height+"px"});parent.appendChild(el);return el;}
    function label(s,parent=stage){const el=document.createElement("div");el.className="label";el.dataset.label=s.id;el.textContent=s.value;Object.assign(el.style,{left:s.center.x+"px",top:s.center.y+"px",fontSize:s.fontSize+"px",fontWeight:s.fontWeight,letterSpacing:s.letterSpacing+"px",color:s.color});parent.appendChild(el);return el;}
    function clickButton(r,fn,title){const b=document.createElement("button");b.className="hit";b.title=title||"";b.setAttribute("aria-label",title||"");Object.assign(b.style,{left:r.x+"px",top:r.y+"px",width:r.width+"px",height:r.height+"px"});b.addEventListener("click",fn);stage.appendChild(b);return b;}
    function icon(name,r){return sprite("assets/icons/"+name+".png",r);}
    function coin(c){sprite(paths.pill,c.pill);icon("coin",c.icon);label(c.text);}
    function utility(u,name,fn,title){sprite(paths.disc,u.disc);icon(name,u.icon);clickButton(u.disc,fn,title);}
    function toast(value){const e=document.querySelector("#toast");e.textContent=value;e.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.classList.remove("show"),1600);}
    function reset(){solved=new Set(["roam","arm","oar"]);hintCount=3;selected=[];board=screens.level.board.cells.map(c=>({...c,rect:{...c.rect}}));render(current);}
    function selectCell(i){
      const cell=board[i];
      if(!cell||cell.count<=0)return;
      if(selected.includes(i)){selected=selected.filter(n=>n!==i);render(current);return;}
      selected.push(i);
      const candidate=selected.map(n=>board[n].letter).join("");
      const target=screens.level.answers.find(a=>!solved.has(a.id)&&a.word===candidate);
      if(target){solved.add(target.id);for(const n of selected)board[n].count=Math.max(0,board[n].count-1);selected=[];toast(target.word+" ✓");}
      else if(selected.length>=6){selected=[];toast("再试一次");}
      render(current);
    }
    function render(mode){
      current=mode;stage.replaceChildren();stage.dataset.screen=mode;document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));
      const s=screens[mode];sprite(s.background,{x:0,y:0,width:1080,height:1920});coin(s.coin);
      if(mode==="lobby"){
        utility(s.calendar,"calendar",()=>toast("Daily puzzle"),"每日字谜");icon("settings",s.settings.icon);clickButton(s.settings.icon,()=>toast("资源预览"),"设置");
        s.labels.forEach(v=>label(v));s.progressNodes.forEach(n=>sprite(n.active?"assets/ui/progress-active.png":"assets/ui/progress-empty.png",n.rect));

      }else{
        utility(s.back,"back",()=>render("lobby"),"返回大厅");
        s.labels.forEach(v=>label(v.id==="wordProgress"?{...v,value:solved.size+" / 5 words"}:v));
        for(const a of s.answers){a.slots.forEach((r,i)=>{const isSolved=solved.has(a.id);sprite(isSolved?paths.answer:paths.empty,r);if(isSolved)label({id:a.id+"-"+i,value:a.word[i],center:{x:r.x+r.width/2,y:r.y+r.height/2},...s.answerLetterStyle,letterSpacing:0});});}
        utility(s.shuffle,"shuffle",()=>{for(let i=board.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[board[i].letter,board[j].letter]=[board[j].letter,board[i].letter];[board[i].count,board[j].count]=[board[j].count,board[i].count];}selected=[];render("level");},"打乱字母");
        utility(s.hint,"hint",()=>{if(hintCount>0){const a=s.answers.find(x=>!solved.has(x.id));if(a){hintCount--;solved.add(a.id);selected=[];toast(a.word+" ✓");render("level");}}},"提示");
        sprite(paths.badge,s.hint.badge);label({...s.hint.count,value:String(hintCount)});
        for(const c of board){
          const img=sprite(paths.letter,c.rect);if(c.count<=0)img.style.opacity=".55";
          if(selected.includes(c.index))sprite(paths.selection,c.rect);
          label({id:"letter-"+c.index,value:c.letter,center:{x:c.rect.x+c.rect.width/2,y:c.rect.y+c.rect.height/2+5},...s.board.letterStyle,letterSpacing:0});
          const n=label({id:"count-"+c.index,value:String(c.count),center:{x:c.rect.x+c.rect.width*.85,y:c.rect.y+c.rect.height*.18},...s.board.counterStyle,letterSpacing:0});n.style.fontStyle="italic";
          const b=clickButton(c.rect,()=>selectCell(c.index),"字母 "+c.letter);b.dataset.cell=c.index;
        }
        if(selected.length){label({id:"currentWord",value:selected.map(i=>board[i].letter).join(""),center:{x:540,y:820},fontSize:44,fontWeight:900,letterSpacing:7,color:"#8A4B32"});}
      }
      window.previewState={screen:mode,solvedCount:solved.size,hints:hintCount,selected:[...selected]};
    }
    document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{selected=[];render(b.dataset.mode);}));
    document.querySelector("#reset").addEventListener("click",reset);
    function resize(){const host=document.querySelector("#screen");stage.style.transform="scale("+(host.clientWidth/1080)+")";}
    new ResizeObserver(resize).observe(document.querySelector("#screen"));render("lobby");resize();
    window.previewApi={render,reset,selectCell,state:()=>window.previewState};
  })();</script></body></html>
