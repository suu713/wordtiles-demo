<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f0">
  <meta name="description" content="WordTiles：原包关卡与自动生成，竖屏连词试玩，无需登录。">
  <title>WordTiles · 单词消消</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=5">
</head>
<body>
  <div class="app-shell">
    <main class="workspace">
      <aside id="editor-panel" class="editor-panel" aria-label="关卡编辑器">
        <div class="editor-heading"><div><span class="eyebrow">WORDTILES</span><h1>关卡编辑器</h1></div><span id="draft-tag" class="draft-tag" data-help-from="config-status" tabindex="0">已应用</span><button id="editor-close" class="icon-button" type="button" aria-label="收起关卡编辑器">×</button></div>
        <label class="algorithm-field" for="algorithm" data-help="算法1读取原安装包关卡；算法2使用 V1 回溯生成器。切换时保留各自的试玩进度。">关卡算法<select id="algorithm"><option value="1">算法1 · 原包关卡</option><option value="2">算法2 · 回溯生成 V1</option></select></label>
        <section id="source-controls" class="source-controls" aria-label="算法1关卡库">
          <div class="field-grid">
            <label for="source-language" data-help="选择原安装包中的语言词库。">语言<select id="source-language"><option value="english">英语</option><option value="portuguese">葡萄牙语</option><option value="russian">俄语</option><option value="spanish">西班牙语</option><option value="turkish">土耳其语</option></select></label>
            <label for="source-order" data-help="原始主线按安装包的关卡顺序排列；全部关卡包含包内其余关卡。">关卡列表<select id="source-order"><option value="main">原始主线</option><option value="all">全部关卡</option></select></label>
          </div>
          <label class="source-position-label" for="source-number">关卡 <span id="source-range">—</span></label>
          <div class="source-navigation"><button id="source-prev" type="button" aria-label="上一关" data-help="载入上一关。">←</button><select id="source-number" aria-label="原包关卡序号" data-help="选择关卡序号，点击载入开始试玩。"><option value="1">第 1 关</option></select><button id="source-next" type="button" aria-label="下一关" data-help="载入下一关。">→</button></div>
          <div class="source-actions"><button id="source-load" class="primary-button" type="button">载入关卡</button><button id="source-random" type="button" data-help="从当前语言和列表中随机载入一关。">随机</button></div>
          <p id="source-library-status" hidden>正在读取关卡目录…</p>
        </section>
        <div id="generation-section" class="generation-section" hidden>
          <label for="seed" data-help="相同种子、算法、搜索预算和词库会生成相同关卡。种子范围为 0～4294967295。">随机种子</label>
          <div class="seed-row"><input id="seed" value="20261010" inputmode="numeric" maxlength="10" autocomplete="off" spellcheck="false" aria-label="关卡随机种子"><button id="generate-seed" type="button" data-help="使用输入的种子生成关卡。">生成</button></div>
          <button id="generate" class="primary-button" type="button" data-help="使用随机种子生成新关卡。只有通过全部校验后才会载入；生成失败保留当前关卡。"><span id="generate-label">生成并试玩</span><span aria-hidden="true">↗</span></button>
          <button id="cancel-generation" class="cancel-button" type="button" hidden data-help="终止当前搜索，保留关卡和试玩进度。">取消生成</button>
        </div>
        <div class="editor-menus">
          <label for="options-menu" class="sr-only">更多设置</label><select id="options-menu" aria-label="更多设置" data-help="查看棋盘参数、画面尺寸、校验报告和原包数据。"><option value="">更多设置…</option><option value="board">棋盘与目标</option><option value="view">画面尺寸</option><option value="debug">校验与预算</option><option value="source">原包数据</option></select>
          <label for="file-action" class="sr-only">关卡文件</label><select id="file-action" aria-label="关卡文件" data-help="导入或导出完整初始关卡 JSON。导入前会使用当前算法的词库和规则进行校验。"><option value="">关卡文件…</option><option value="import">导入 JSON</option><option value="export">导出 JSON</option><option value="sample" hidden>固定样例</option></select>
        </div>
        <div class="editor-current"><span id="level-kind" data-help-from="source-library-status">原包关卡</span><span><span id="active-seed-label" class="sr-only">原关卡 ID</span><code id="active-seed">—</code></span></div>
        <button id="editor-status" class="editor-status" type="button" data-help-from="notice">正在加载…</button>
        <p id="notice" hidden role="status" aria-live="polite">正在加载本地关卡…</p>
        <p id="config-status" hidden></p><p id="preview-state" hidden></p><p id="preview-note" hidden></p>
        <div hidden><button id="load-sample" type="button">载入固定样例</button><button id="import" type="button">导入 JSON</button><button id="export" type="button">导出 JSON</button></div><input id="import-file" type="file" accept=".json,application/json" hidden>
      </aside>
      <section class="preview-column" aria-label="竖屏游戏">
        <div class="viewport-sizer"><div id="game-viewport" class="game-viewport">
          <section class="play-panel" aria-label="单词棋盘">
            <div class="game-title-row"><div><span class="game-eyebrow">WORDTILES</span><h2>单词消消</h2></div><div class="game-tools"><button id="editor-toggle" class="game-tool" type="button" aria-label="打开关卡编辑器" aria-controls="editor-panel" aria-expanded="false">关卡 ▾</button><button id="rules-button" class="game-tool help-button" type="button" aria-label="玩法说明" data-help="按住字母，连接上下左右相邻的格子，可以转弯。同一次不能重复经过同一格。松手提交，经过短词时不会提前提交。找到目标后经过的格子次数减 1，归零后留空。算法1只接受每个目标固定的消耗集合，额外词只记录。完成顺序不限，输错不扣次数。键盘：方向键移动，空格选格，Backspace 撤回，Enter 提交，Esc 取消。">?</button></div></div>
            <div class="play-header"><span id="game-level-label" class="game-level-label" data-help-from="preview-state" tabindex="0">算法1 · 第1关</span><span id="completion" class="completion">0 <span>/ 3</span></span></div>
            <div id="targets" class="targets" aria-label="目标词"></div>
            <span id="targets-note" class="targets-note" hidden tabindex="0" aria-label="上下滑动查看其余目标" data-help="上下滑动这个目标区域，查看其余目标词。">⋯ ↕</span>
            <div class="game-board-area"><div class="board-surround"><div class="board-top"><span id="board-size">3 × 3 棋盘</span><span id="remaining" data-help="每格右上角的圆点或数字表示剩余次数。次数归零后格子留空，棋盘不移动。" tabindex="0">剩余次数 9</span></div><div id="board" class="board" aria-label="字母棋盘"></div></div></div>
            <div class="readout"><span id="readout-label" class="readout-label">正在连接</span><strong id="current-word" aria-live="polite">—</strong></div>
            <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
            <div id="win-banner" class="win-banner" hidden><span aria-hidden="true">✳</span><div><strong>棋盘清空！</strong><p id="win-summary">全部目标都找到了。</p></div><button id="win-next" type="button">下一关 ↗</button></div>
            <div class="play-actions"><button id="hint" class="secondary-button" type="button" data-help="标出一个尚未完成目标的可用路径，按编号顺序连接。">✧ 提示</button><button id="restart" class="secondary-button" type="button" data-help="重开当前关卡，恢复全部初始字母和次数。">↻ 重开</button></div>
          </section>
        </div></div>
      </section>
    </main>
  </div>
  <section id="settings-popover" class="settings-popover" role="dialog" aria-labelledby="settings-title" tabindex="-1" hidden>
    <div class="settings-heading"><h2 id="settings-title">更多设置</h2><button id="settings-close" class="icon-button" type="button" aria-label="关闭设置">×</button></div>
    <div class="settings-body">
      <div data-settings-pane="board" hidden>
        <div class="field-grid"><label for="board-cols" data-help-from="cols-note">棋盘宽度<select id="board-cols" disabled><option value="2">2 列</option><option value="3" selected>3 列</option><option value="4">4 列</option><option value="5">5 列</option><option value="6">6 列</option></select></label><label for="board-rows" data-help-from="rows-note">棋盘高度<select id="board-rows" disabled><option value="2">2 行</option><option value="3" selected>3 行</option><option value="4">4 行</option><option value="5">5 行</option><option value="6">6 行</option></select></label></div>
        <label class="stack-field" for="word-count" data-help-from="count-note">单词数量<select id="word-count" disabled></select></label>
        <label class="stack-field" for="target-length-list" data-help-from="length-note">目标词长度</label><div id="word-lengths"></div>
        <div class="draft-summary" data-help-from="uses-note" tabindex="0"><div><strong id="summary-cells">9</strong><span>格子</span></div><div><strong id="summary-targets">3</strong><span>单词</span></div><div><strong id="summary-letters">9</strong><span>字母</span></div></div>
        <div hidden><select id="uniform-length"><option value="">按原关卡显示</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select><span id="uses-note"></span><span id="cols-note"></span><span id="rows-note"></span><span id="count-note"></span><span id="length-note"></span><span id="uniform-note"></span></div>
      </div>
      <div data-settings-pane="view" hidden><label class="stack-field" for="preview-device" data-help="保持 9:16 竖屏比例，并在浏览器内完整显示。固定尺寸在空间不足时会等比缩小。">画面尺寸<select id="preview-device"><option value="auto">自动适配 · 9:16</option><option value="360x640">360 × 640</option><option value="405x720">405 × 720</option><option value="450x800">450 × 800</option></select></label><label class="stack-field" for="preview-zoom">画面缩放<select id="preview-zoom"><option value="100">100%</option><option value="85">85%</option><option value="75">75%</option></select></label></div>
      <div id="debug" data-settings-pane="debug" hidden><span class="validation-status" id="validation-badge" data-help-from="version-note" tabindex="0">正在检查</span><p class="debug-explanation" hidden></p><div class="debug-scroll"><table><thead><tr><th>目标</th><th>路径数</th><th>集合数</th><th>消耗格子</th><th>参考路径</th></tr></thead><tbody id="debug-targets"></tbody></table></div><div id="debug-counts" class="debug-counts"></div><div id="debug-checks" class="debug-checks"></div>
        <fieldset id="budget-fields" class="budget-fields" hidden data-help="这三个参数控制搜索预算，不代表难度。预算耗尽会明确失败，并保留当前关卡。"><legend>搜索预算</legend><label>每次节点<input id="budget-attempt" type="number" min="1" max="1000000" value="10000"></label><label>最多尝试<input id="budget-tries" type="number" min="1" max="1000" value="30"></label><label>总节点<input id="budget-total" type="number" min="1" max="10000000" value="300000"></label></fieldset>
        <pre id="debug-generation" hidden>尚未进行自动生成。</pre><pre id="debug-rejection" hidden></pre><p id="version-note" hidden></p>
      </div>
      <div data-settings-pane="source" hidden><div id="source-metadata" data-help="额外词只记录，不扣次数。原包特殊障碍和其他字段完整保留在导出数据中；试玩沿用网页连词规则。" tabindex="0"><pre id="source-meta"></pre></div></div>
    </div>
  </section>
  <div id="hover-help" class="hover-help" role="tooltip" hidden></div>
  <script type="module" src="./app.js?v=5"></script>
</body>
</html>
