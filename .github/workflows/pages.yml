name: Validate and deploy WordTiles

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Compile supplied algorithm
        run: npm run build:algorithm
      - name: Run rules and integration tests
        run: npm test
      - name: Run lexicon classifier boundary tests
        run: python3 -m unittest discover -s wordtiles_lexicon_builder -p test_classifier.py -v
      - name: Validate 100 seeds with the expanded lexicon
        run: npm run test:lexicon
      - name: Validate 1000 generated levels and all completion orders
        run: npm run test:batch
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
